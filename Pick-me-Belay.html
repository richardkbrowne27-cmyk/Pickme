<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pick Me ✨ — Enhanced</title>
<style>
  :root{
    --bg:#060606;--fg:#f9fafb;--accent:#ce1126;--accent2:#f4f4f4;--shadow:0 20px 35px rgba(0,0,0,.45);
    --surface:linear-gradient(135deg, rgba(18,18,18,.95), rgba(32,32,32,.92));
    --stripe:linear-gradient(135deg, rgba(206,17,38,.95) 35%, rgba(255,255,255,.88) 36%, rgba(8,8,8,.9) 55%);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 system-ui,Segoe UI,Roboto;
    display:grid;place-items:center;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:-20vh;pointer-events:none;
    background:var(--stripe);transform:rotate(-8deg) scale(1.3);
    opacity:.45;filter:blur(12px);
  }
  .card{
    padding:1.4rem 1.2rem;border-radius:18px;background:var(--surface);
    border:1px solid rgba(244,244,244,.12);
    box-shadow:var(--shadow);text-align:center;width:min(720px,92vw);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;
    background:linear-gradient(135deg, rgba(206,17,38,.4), transparent 55%);
  }
  h1{margin:.2rem 0 1rem}
  .hint{opacity:.85}
  .links{margin-top:.8rem;display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
  a{color:var(--accent2);text-decoration:none;border:1px solid rgba(244,244,244,.2);padding:.45rem .7rem;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.04);transition:.25s ease}
  a:hover{background:rgba(206,17,38,.3);border-color:rgba(206,17,38,.55);color:#fff}
  .plan{margin:1.4rem 0 0;background:rgba(12,12,12,.7);border-radius:14px;padding:1rem;border:1px solid rgba(244,244,244,.12);text-align:left}
  .plan h2{margin:.2rem 0 1rem;font-size:1.1rem;letter-spacing:.02em;text-transform:uppercase;color:var(--accent)}
  .plan ol{margin:0;padding-left:1.2rem;display:grid;gap:.6rem;font-size:.98rem}
  button{
    margin-top:1rem;padding:.85rem 1.1rem;font-weight:700;border:none;border-radius:12px;
    background:linear-gradient(120deg,var(--accent),#5b000d,var(--accent));color:#fdfdfd;cursor:pointer;box-shadow:0 12px 25px rgba(0,0,0,.35);
    border:1px solid rgba(0,0,0,.6);text-transform:uppercase;letter-spacing:.05em
  }
  button:hover{filter:brightness(1.05)}
  .type{margin:.6rem auto 0;font-size:1.15rem;border-right:2px solid var(--accent2);white-space:nowrap;overflow:hidden;width:0;
        animation:typing 1.8s steps(32,end) forwards, caret .9s steps(1,end) infinite}
  @keyframes typing{to{width:100%}} @keyframes caret{50%{border-color:transparent}}
  .toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-20px) scale(.98);background:rgba(12,12,12,.88);
         padding:.6rem 1rem;border-radius:10px;opacity:0;transition:.35s;border:1px solid rgba(255,255,255,.15);color:var(--accent2);
         box-shadow:0 12px 28px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
  canvas#fx{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="card">
  <h1>Ready to launch the <span style="color:var(--accent)">Hiring Cafe bot</span></h1>
  <p class="hint">We’ll auto-apply to Accountant, Staff Accountant, Senior Accountant, and Treasury Analyst roles.</p>

  <div id="line" class="type" aria-label="typed line"></div>
  <div class="links">
    <a href="https://hiring.cafe" data-msg="Opening Hiring Cafe" data-confetti="true">Hiring Cafe</a>
    <a href="https://www.linkedin.com/jobs/search/?keywords=accountant" data-msg="Scanning LinkedIn job feed">LinkedIn Search</a>
    <a href="https://docs.google.com/document/d/1eResumeTemplate" data-msg="Update your master resume">Resume Template</a>
  </div>

  <div class="plan" aria-live="polite">
    <h2>Automation Blueprint</h2>
    <ol id="planSteps"></ol>
  </div>

  <button id="go">Generate Bot Gameplan</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const toast = document.getElementById('toast');
  const line  = document.getElementById('line');
  const steps = document.getElementById('planSteps');
  const cv    = document.getElementById('fx');
  const ctx   = cv.getContext('2d');

  const plan = [
    'Sync your resume & transcripts with Hiring Cafe profile data.',
    'Monitor new Accountant-family roles every 30 minutes with saved searches.',
    'Auto-fill applicant info using stored credentials and answer pre-screen questions.',
    'Log each submission with company, role, and status for rapid follow-up.',
    'Trigger notifications to your email & Slack when interviews are requested.'
  ];

  function renderPlan(){
    steps.innerHTML = '';
    plan.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      steps.appendChild(li);
    });
  }

  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', fit, {passive:true}); fit();

  let toastTimer, raf;
  function showToast(msg, ms=1600){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), ms);
  }

  function typeMessage(msg){
    line.style.width = '0'; void line.offsetWidth;
    line.textContent = msg;
    line.style.animation = 'none'; void line.offsetWidth;
    line.style.animation = 'typing 1.8s steps(32,end) forwards, caret .9s steps(1,end) infinite';
  }

  function confetti(n=140){
    cancelAnimationFrame(raf);
    const parts=[], cols=['#ce1126','#ffffff','#111111','#f4f4f4'];
    for(let i=0;i<n;i++){
      parts.push({x:innerWidth/2, y:innerHeight*.28,
                  vx:(Math.random()-0.5)*12, vy:Math.random()*-10-4,
                  g:.28+Math.random()*.2, s:5+Math.random()*6, a:1,
                  c:cols[(Math.random()*cols.length)|0], r:Math.random()*Math.PI});
    }
    (function step(){
      ctx.clearRect(0,0,cv.width,cv.height);
      let alive = false;
      for(const p of parts){
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += .15; p.a -= .007;
        if(p.a>0 && p.y<innerHeight+40) alive = true;
        ctx.globalAlpha = Math.max(0,p.a);
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
      }
      ctx.globalAlpha = 1;
      if(alive) raf = requestAnimationFrame(step);
    })();
  }

  function runShow(msg, doConfetti=false){
    typeMessage(msg);
    if(doConfetti) confetti();
    showToast(msg || "✨ Let's go!");
  }

  document.getElementById('go').addEventListener('click', () => {
    renderPlan();
    runShow('🚀 Blueprint generated — time to build!');
  });

  document.querySelectorAll('.links a').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const msg = link.dataset.msg;
      const doConfetti = link.dataset.confetti === 'true';
      const url = link.href;
      runShow(msg, doConfetti);
      setTimeout(() => {
        window.open(url, link.target || '_self');
      }, 1000);
    });
  });

  addEventListener('paste', (e) => {
    const txt = (e.clipboardData || window.clipboardData).getData('text') || '';
    const hasLink = /https?:\/\/\S+/i.test(txt);
    if (hasLink) {
      const snippet = txt.trim().slice(0, 48) + (txt.length > 48 ? '…' : '');
      runShow(`📋 Pasted link: ${snippet}`);
    } else {
      runShow("📋 Pasted text — nice!");
    }
  });

  const introMessages = [
    'Mapping the accountant job universe…',
    'Queuing auto-apply workflow for Hiring Cafe…',
    'Prepping resume tailoring engine…'
  ];
  runShow(introMessages[Math.floor(Math.random() * introMessages.length)]);
  renderPlan();

})();
</script>
</body>
</html>
