<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pick Me ✨ — Hiring Cafe Automation</title>
  <meta http-equiv="refresh" content="0; url=index.html" />
  <script>
    const target = new URL('index.html', window.location.href);
    if (window.location.href !== target.href) {
      window.location.replace(target.href);
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060606;
      --fg: #f9fafb;
      --accent: #ce1126;
    }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 1.5rem;
    }
    main {
      max-width: 560px;
      padding: 2.5rem 2rem;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: linear-gradient(135deg, rgba(18, 18, 18, .95), rgba(32, 32, 32, .92));
      text-align: center;
      box-shadow: 0 22px 35px rgba(0, 0, 0, .45);
    }
    h1 {
      margin-top: 0;
      color: var(--accent);
    }
    p {
      margin: .75rem 0;
      color: rgba(249, 250, 251, .82);
    }
    a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: rgba(255, 255, 255, .04);
      border-radius: 999px;
      padding: .4rem .9rem;
      margin-top: 1rem;
      font-size: .9rem;
    }
    .dot {
      width: .55rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 .2rem rgba(206, 17, 38, .25);
    }
  </style>
</head>
<body>
<main>
  <h1>Redirecting to the Hiring Cafe bot</h1>
  <p>One moment while we load the refreshed automation experience.</p>
  <p>If the page does not change automatically, visit <a href="index.html">index.html</a> or refresh your browser cache.</p>
  <div class="status"><span class="dot" aria-hidden="true"></span><span>Routing to the new Trinidad &amp; Tobago themed launch pad…</span></div>
</main>
</body>
</html>
