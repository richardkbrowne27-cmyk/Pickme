<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pick Me ✨ — Enhanced</title>
<style>
  :root{
    --bg:#00263a;--fg:#f9fafb;--accent:#ff914d;--accent2:#06b6d4;--shadow:0 20px 35px rgba(0,0,0,.35)
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 system-ui,Segoe UI,Roboto;
    display:grid;place-items:center;overflow:hidden;
  }
  .card{
    padding:1.4rem 1.2rem;border-radius:16px;background:#0a3144;border:1px solid rgba(255,255,255,.1);
    box-shadow:var(--shadow);text-align:center;width:min(720px,92vw)
  }
  h1{margin:.2rem 0 1rem}
  .hint{opacity:.85}
  .links{margin-top:.8rem;display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
  a{color:var(--accent2);text-decoration:none;border:1px solid rgba(255,255,255,.15);padding:.45rem .7rem;border-radius:10px;cursor:pointer}
  a:hover{background:rgba(255,255,255,.08)}
  button{
    margin-top:1rem;padding:.85rem 1.1rem;font-weight:700;border:none;border-radius:12px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));color:#081126;cursor:pointer
  }
  .type{margin:.6rem auto 0;font-size:1.15rem;border-right:2px solid var(--accent);white-space:nowrap;overflow:hidden;width:0;
        animation:typing 1.8s steps(32,end) forwards, caret .9s steps(1,end) infinite}
  @keyframes typing{to{width:100%}} @keyframes caret{50%{border-color:transparent}}
  .toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-20px) scale(.98);background:#0f3c55;
         padding:.6rem 1rem;border-radius:10px;opacity:0;transition:.35s;border:1px solid #1c5578}
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
  canvas#fx{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="card">
  <h1>Hi Belay — I’m <span style="color:var(--accent)">Richard Browne</span></h1>
  <p class="hint">Click a link or paste one — the show begins. 🎉</p>

  <div id="line" class="type" aria-label="typed line"></div>
  <div class="links">
    <a href="https://philadelphiaeagles.com" data-msg="Go Eagles">Eagles Fan</a>
    <a href="https://yourfamilylink.com" data-msg="I love my family">Family Link</a>
    <a href="https://yourportfolio.com" data-msg="Pick me I'm the best" data-confetti="true">Pick Me</a>
  </div>
  <button id="go">Show Creativity</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const toast = document.getElementById('toast');
  const line  = document.getElementById('line');
  const cv    = document.getElementById('fx');
  const ctx   = cv.getContext('2d');

  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', fit, {passive:true}); fit();

  let toastTimer, raf;
  function showToast(msg, ms=1600){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), ms);
  }

  function typeMessage(msg){
    line.style.width = '0'; void line.offsetWidth;
    line.textContent = msg;
    line.style.animation = 'none'; void line.offsetWidth;
    line.style.animation = 'typing 1.8s steps(32,end) forwards, caret .9s steps(1,end) infinite';
  }

  function confetti(n=140){
    cancelAnimationFrame(raf);
    const parts=[], cols=['#ff914d','#06b6d4','#facc15','#22c55e','#f472b6','#93c5fd'];
    for(let i=0;i<n;i++){
      parts.push({x:innerWidth/2, y:innerHeight*.28,
                  vx:(Math.random()-0.5)*12, vy:Math.random()*-10-4,
                  g:.28+Math.random()*.2, s:5+Math.random()*6, a:1,
                  c:cols[(Math.random()*cols.length)|0], r:Math.random()*Math.PI});
    }
    (function step(){
      ctx.clearRect(0,0,cv.width,cv.height);
      let alive = false;
      for(const p of parts){
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += .15; p.a -= .007;
        if(p.a>0 && p.y<innerHeight+40) alive = true;
        ctx.globalAlpha = Math.max(0,p.a);
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
      }
      ctx.globalAlpha = 1;
      if(alive) raf = requestAnimationFrame(step);
    })();
  }

  function runShow(msg, doConfetti=false){
    typeMessage(msg);
    if(doConfetti) confetti();
    showToast(msg || "✨ Let's go!");
  }

  document.getElementById('go').addEventListener('click', () => runShow("🎉 Button clicked", true));

  document.querySelectorAll('.links a').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const msg = link.dataset.msg;
      const doConfetti = link.dataset.confetti === 'true';
      const url = link.href;
      runShow(msg, doConfetti);
      setTimeout(() => {
        window.open(url, link.target || '_self');
      }, 1000);
    });
  });

  addEventListener('paste', (e) => {
    const txt = (e.clipboardData || window.clipboardData).getData('text') || '';
    const hasLink = /https?:\/\/\S+/i.test(txt);
    if (hasLink) {
      const snippet = txt.trim().slice(0, 48) + (txt.length > 48 ? '…' : '');
      runShow(`📋 Pasted link: ${snippet}`);
    } else {
      runShow("📋 Pasted text — nice!");
    }
  });

})();
</script>
</body>
</html>
